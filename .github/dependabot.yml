# Dependabot: una vez por semana propone las actualizaciones de las dependencias y de las acciones de GitHub.
# Cada propuesta pasa por las mismas pruebas que cualquier otro cambio.
# Si cambia Electron, steam-games-mcp, electron-updater o alguna de sus dependencias, actualizar su versión en
# THIRD_PARTY_NOTICES.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Las herramientas (Playwright, axe, Prettier, Electron Builder) llegan juntas; Electron, por separado.
      herramientas:
        dependency-type: development
        exclude-patterns: ['electron']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
