# Integración continua: cada push y cada pull request pasan por las mismas pruebas que `npm run verify`.
name: Pruebas

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Código y pruebas en Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisión de sintaxis, módulos y estilos
        run: npm run check
      - name: Formato
        run: npx prettier --check src public test tools
      - name: Vulnerabilidades altas o críticas en las dependencias
        run: npm audit --audit-level=high
      - name: Pruebas
        run: npm test

  interfaz:
    name: Interfaz (Playwright)
    runs-on: ubuntu-24.04 # fijo: las capturas de referencia dependen de las fuentes del sistema
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Pantallas, flujos, accesibilidad y capturas
        run: npm run test:ui
      - name: Informe y diferencias de las capturas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-interfaz
          path: |
            test/ui/.informe
            test/ui/.resultados
          retention-days: 14
          # Las carpetas empiezan con punto: sin esto, upload-artifact las omite y no sube nada.
          include-hidden-files: true

  # El nombre del trabajo es un chequeo obligatorio de main: si cambia, hay que cambiarlo en la protección de la rama.
  ejecutable:
    name: Ejecutable portable
    needs: [windows, interfaz]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalador y portable
        run: npm run package
      - name: El portable abre
        run: npm run smoke
      - name: El instalador instala y la versión instalada abre
        shell: pwsh
        run: |
          $instalador = Get-ChildItem releases -Filter 'Viciodromo-Setup-*.exe' | Select-Object -First 1
          Start-Process -FilePath $instalador.FullName -ArgumentList '/S' -Wait
          $instalado = Get-ChildItem "$env:LOCALAPPDATA\Programs\viciodromo" -Filter '*.exe' |
            Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
          if (-not $instalado) { throw 'El instalador no dejó el programa en Programs\viciodromo.' }
          node tools/smoke.mjs $instalado.FullName
      - uses: actions/upload-artifact@v7
        with:
          name: viciodromo
          path: releases/*.exe
          retention-days: 14
