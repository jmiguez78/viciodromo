# Publicación: al subir una etiqueta vX.Y.Z se arman el instalador y el portable y se publica una versión en GitHub con las notas
# de CHANGELOG.md. La aplicación consulta esa versión para avisar que hay una nueva (gml.releases en package.json).
name: Publicar versión

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: La etiqueta coincide con package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Instalador y portable
        run: npm run package
      - name: El portable abre
        run: npm run smoke
      - name: Notas de la versión
        shell: bash
        run: node tools/release-notes.mjs "${GITHUB_REF_NAME}" > notas.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Viciódromo ${{ github.ref_name }}
          body_path: notas.md
          # latest.yml y el .blockmap son lo que consulta la actualización automática de la versión instalada.
          files: |
            releases/*.exe
            releases/*.exe.blockmap
            releases/latest.yml
